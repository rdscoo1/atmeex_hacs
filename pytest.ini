# pytest.ini
[pytest]
# где лежат тесты
testpaths = tests

# для async-тестов (pytest-asyncio)
asyncio_mode = auto
# Pin the async fixture loop scope so pytest-asyncio does not emit a
# deprecation warning about the unset default.
asyncio_default_fixture_loop_scope = function

# немного более подробный вывод
addopts = -ra

# чтобы pytest видел наш пакет custom_components как модуль
pythonpath = .
